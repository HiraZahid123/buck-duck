# One-click deploy on Render: New → Blueprint → point at this repository.
services:
  - type: web
    name: buckduck
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: buckduck-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
